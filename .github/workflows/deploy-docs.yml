name: Deploy docs

# Builds the Starlight docs in site/ and publishes to GitHub Pages.
# Only runs when the docs (or this workflow) change.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least privilege: Pages deploy needs id-token + pages write; everything else read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Astro / Starlight)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by commit SHA per GitHub's supply-chain guidance.
      # Bump SHAs alongside the version comment when upgrading.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build with Astro
        uses: withastro/action@b7d53628f8b666036b0238aadb0b984a2a489f26  # v6.1.1
        with:
          path: ./site
          node-version: 20

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
