name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read-only, no auto-push of credentials into the working tree.
permissions:
  contents: read

jobs:
  validate:
    name: validate + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # plugin.json declares engines.node >= 20, so 20 is the floor we promise
        # and must keep green. 22 is Active LTS. Testing both catches version-gated
        # API differences — e.g. `node --test` only accepts glob patterns on 21+,
        # which is why the suite is invoked with an expanded file list.
        node: ['20', '22']
    steps:
      # Actions pinned by commit SHA per GitHub's supply-chain guidance.
      # Bump SHAs alongside the version comment when upgrading.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Validate marketplace manifest (strict)
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict

      - name: Validate plugin manifest (strict)
        run: npx -y @anthropic-ai/claude-code plugin validate ./.claude-plugin/plugin.json --strict

      - name: Verify all .mjs scripts are syntactically valid
        run: |
          for f in scripts/*.mjs; do
            echo "Checking $f"
            node --check "$f"
          done

      # Behavioural tests for the deterministic Node helpers — the drift
      # detector, the result-schema gate, and the credential resolver. Built on
      # node:test so the repo keeps its zero-dependency posture.
      # The glob is intentionally unquoted: Node only accepts glob patterns for
      # --test from v21, so the shell expands it into an explicit file list that
      # every supported Node version understands.
      - name: Run the script test suite
        run: node --test tests/*.test.mjs

      - name: Verify marketplace source paths resolve to a real plugin
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const mp = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            for (const p of mp.plugins) {
              const src = typeof p.source === 'string' ? p.source : null;
              if (!src) { console.log('skipping non-string source for', p.name); continue; }
              const manifest = require('path').join(src, '.claude-plugin', 'plugin.json');
              if (!fs.existsSync(manifest)) {
                console.error('Marketplace entry', p.name, 'source', src, 'has no .claude-plugin/plugin.json at', manifest);
                process.exit(1);
              }
              console.log('OK', p.name, '→', manifest);
            }
          "
